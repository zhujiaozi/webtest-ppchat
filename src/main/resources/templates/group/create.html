<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: html(title='创建群聊', content=~{::main})}">
<main>
    <h2>创建群聊</h2>
    <div class="form-container">
        <form th:action="@{/groups/create}" method="post">
            <div class="form-group">
                <label>群名称</label>
                <input type="text" name="name" required placeholder="请输入群名称">
            </div>
            <div class="form-group">
                <label>邀请好友入群</label>
                <div th:each="f : ${friends}">
                    <label style="font-weight:normal">
                        <input type="checkbox" name="memberIds" th:value="${f.friendId}">
                        <span th:text="${f.remark ?: '用户' + f.friendId}"></span>
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">创建</button>
            <a th:href="@{/groups}" class="btn">取消</a>
        </form>
    </div>
</main>
</html>
