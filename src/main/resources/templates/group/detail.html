<div th:replace="~{common/layout :: layout(title=${group.name} + ' — PP Chat', content=~{::#content})}">
  <div id="content">
    <div class="mgmt-body" style="max-width:720px">
      <div style="display:flex;gap:12px;margin-bottom:20px">
        <a th:href="@{/groups}" class="btn btn-ghost">← 返回</a>
        <a th:href="@{/chat}" class="btn btn-primary">进入聊天</a>
      </div>

      <div class="group-detail">
        <!-- 群信息 -->
        <div class="group-info-card">
          <h2 th:text="${group.name}"></h2>
          <div class="meta" th:text="'创建时间: ' + ${group.createdAt}"></div>
        </div>

        <!-- 群公告 -->
        <div class="card" style="padding:20px">
          <h3 style="font-size:15px;font-weight:600;margin-bottom:12px">群公告</h3>
          <form th:action="@{/groups/{id}/notice(id=${group.id})}" method="post">
            <div style="display:flex;gap:8px">
              <input type="text" name="notice" class="input" th:value="${group.notice}" placeholder="设置群公告">
              <button type="submit" class="btn btn-ghost">更新</button>
            </div>
          </form>
        </div>

        <!-- 群成员 -->
        <div class="card" style="padding:20px">
          <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">群成员</h3>
          <div class="member-grid">
            <div th:each="m : ${members}" class="member-item">
              <div class="avatar avatar-sm avatar-placeholder" th:text="${#strings.substring('U', 0, 1)}"></div>
              <span class="member-name" th:text="'用户 #' + ${m.userId}"></span>
              <span class="member-role" th:text="${m.role == 2 ? '群主' : (m.role == 1 ? '管理员' : '成员')}"></span>
              <form th:if="${isOwner and m.role != 2}" th:action="@{/groups/{id}/kick/{uid}(id=${group.id},uid=${m.userId})}" method="post" style="display:inline"
                    onsubmit="return confirm('确定踢出该成员？')">
                <button type="submit" class="btn btn-sm btn-danger">踢出</button>
              </form>
            </div>
          </div>
        </div>

        <!-- 操作 -->
        <div class="card" style="padding:20px">
          <div style="display:flex;gap:12px">
            <form th:action="@{/groups/{id}/leave(id=${group.id})}" method="post"
                  onsubmit="return confirm('确定退出该群聊？')">
              <button type="submit" class="btn btn-danger">退出群聊</button>
            </form>
            <form th:if="${isOwner}" th:action="@{/groups/{id}/dissolve(id=${group.id})}" method="post"
                  onsubmit="return confirm('确定解散该群聊？此操作不可撤销！')">
              <button type="submit" class="btn btn-ghost" style="color:var(--danger);border-color:var(--danger)">解散群聊</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
