<div th:replace="~{common/layout :: layout(title='群聊 — PP Chat', content=~{::#content})}">
  <div id="content">
    <div class="mgmt-body" style="flex-direction:column;max-width:720px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="font-size:20px;font-weight:700">我的群聊</h2>
        <a th:href="@{/groups/create}" class="btn btn-primary">+ 创建群</a>
      </div>

      <div th:if="${#lists.isEmpty(groups)}" class="card" style="padding:60px;text-align:center">
        <p style="color:var(--text-tertiary);margin-bottom:16px">还没有加入任何群聊</p>
        <a th:href="@{/groups/create}" class="btn btn-primary">创建第一个群</a>
      </div>

      <div class="group-grid">
        <a th:each="g : ${groups}" th:href="@{/groups/{id}(id=${g.id})}" class="group-card">
          <div class="group-name" th:text="${g.name}"></div>
          <div class="group-meta" th:text="${g.notice ?: '暂无公告'}"></div>
        </a>
      </div>
    </div>
  </div>
</div>
