<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: html(title='个人中心', content=~{::main})}">
<main>
    <h2>个人中心</h2>
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <div th:if="${msg}" style="color:green;padding:8px" th:text="${msg}"></div>
    <div class="form-container">
        <form th:action="@{/profile/update}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>头像</label>
                <div th:if="${user.avatar}">
                    <img th:src="${user.avatar}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">
                </div>
                <input type="file" name="avatarFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" name="nickname" th:value="${user.nickname}">
            </div>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" th:value="${user.username}" disabled>
            </div>
            <div class="form-group">
                <label>登录次数</label>
                <input type="text" th:value="${user.loginCount}" disabled>
            </div>
            <div class="form-group">
                <label>最近登录</label>
                <input type="text" th:value="${user.lastLogin}" disabled>
            </div>
            <button type="submit" class="btn btn-primary">保存修改</button>
        </form>
    </div>
    <div class="form-container" style="margin-top:20px">
        <h3>修改密码</h3>
        <form th:action="@{/profile/password}" method="post">
            <div class="form-group">
                <label>原密码</label>
                <input type="password" name="oldPassword" required>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" name="newPassword" required>
            </div>
            <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
    </div>
</main>
</html>
