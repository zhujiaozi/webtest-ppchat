<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <h1>PP</h1>
            <p>创建你的账号</p>
        </div>
        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" class="input" required placeholder="请输入用户名" autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" class="input" required placeholder="请输入密码">
            </div>
            <div class="form-group">
                <label for="nickname">昵称 <span style="color:var(--text-tertiary);font-weight:400">(可选)</span></label>
                <input type="text" id="nickname" name="nickname" class="input" placeholder="不填则使用用户名">
            </div>
            <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="form-footer">已有账号？<a th:href="@{/login}">去登录</a></p>
    </div>
</div>
</body>
</html>
