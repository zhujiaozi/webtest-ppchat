<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title} ?: 'PP Chat'">PP Chat</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script th:src="@{/js/theme.js}"></script>
</head>
<body>
  <div class="mgmt-page">
    <header class="mgmt-header">
      <span class="brand">PP Chat</span>
      <div class="nav-links">
        <a th:href="@{/chat}">聊天</a>
        <a th:href="@{/friends}">好友</a>
        <a th:href="@{/groups}">群聊</a>
        <a th:href="@{/profile}">个人中心</a>
        <a th:href="@{/logout}">退出</a>
        <span id="theme-area"></span>
      </div>
    </header>
    <th:block th:replace="${content}"></th:block>
  </div>
  <script>document.getElementById('theme-area').appendChild(ThemeManager.createSwitcher());</script>
</body>
</html>
