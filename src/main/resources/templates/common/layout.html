<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'PP 聊天'">PP 聊天</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar" th:if="${session.currentUser != null}">
        <div class="nav-brand">💬 PP 聊天</div>
        <div class="nav-links">
            <a th:href="@{/}">首页</a>
            <a th:href="@{/chat}">聊天</a>
            <a th:href="@{/friends}">好友</a>
            <a th:href="@{/groups}">群聊</a>
            <a th:href="@{/profile}">个人中心</a>
            <span class="nav-user" th:text="${session.currentUser.nickname ?: session.currentUser.username}"></span>
            <a th:href="@{/logout}" class="btn-logout">退出</a>
        </div>
    </nav>
    <div class="container">
        <div th:replace="${content}"></div>
    </div>
</body>
</html>
