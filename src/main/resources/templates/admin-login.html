<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 — PP Chat</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:#0f1117;display:flex;justify-content:center;align-items:center;min-height:100vh;
            background:radial-gradient(ellipse at 30% 40%,rgba(56,89,156,.12),transparent 60%),
                       radial-gradient(ellipse at 70% 60%,rgba(99,102,241,.08),transparent 50%),
                       #0f1117;
        }
        .login-card{
            background:rgba(255,255,255,.04);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,.06);border-radius:16px;
            padding:48px 40px;width:400px;max-width:90vw;
            box-shadow:0 8px 40px rgba(0,0,0,.4);animation:scaleIn .4s ease both;
        }
        @keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
        .login-card h1{
            text-align:center;font-size:28px;font-weight:800;margin-bottom:6px;
            background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .login-card .subtitle{text-align:center;color:rgba(255,255,255,.4);margin-bottom:32px;font-size:13px;letter-spacing:1px}
        .error-msg{background:rgba(250,81,81,.12);border:1px solid rgba(250,81,81,.25);color:#ff8e92;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;text-align:center}
        .form-group{margin-bottom:18px}
        .form-group label{display:block;margin-bottom:6px;color:rgba(255,255,255,.55);font-size:13px}
        .form-group input{
            width:100%;padding:11px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
            border-radius:10px;font-size:14px;color:#fff;outline:none;transition:all .2s;
        }
        .form-group input::placeholder{color:rgba(255,255,255,.25)}
        .form-group input:hover{background:rgba(255,255,255,.07)}
        .form-group input:focus{border-color:rgba(99,102,241,.5);box-shadow:0 0 0 3px rgba(99,102,241,.12);background:rgba(255,255,255,.08)}
        .btn{
            display:block;width:100%;padding:12px;background:linear-gradient(135deg,#818cf8,#6366f1);
            color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
            transition:all .2s;letter-spacing:.5px;
        }
        .btn:hover{box-shadow:0 6px 24px rgba(99,102,241,.35);transform:translateY(-1px)}
        .back-link{text-align:center;margin-top:20px}
        .back-link a{color:rgba(255,255,255,.35);font-size:13px;text-decoration:none;transition:color .2s}
        .back-link a:hover{color:rgba(255,255,255,.6)}
    </style>
</head>
<body>
<div class="login-card">
    <h1>PP Chat</h1>
    <p class="subtitle">后台管理系统</p>
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/admin/login}" method="post">
        <div class="form-group">
            <label for="username">管理员账号</label>
            <input type="text" id="username" name="username" required placeholder="请输入账号" autofocus>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn">登录</button>
    </form>
    <div class="back-link"><a th:href="@{/}">返回首页</a></div>
</div>
</body>
</html>
