<div th:replace="~{common/layout :: layout(title='好友管理 — PP Chat', content=~{::#content})}">
  <div id="content">
    <div class="mgmt-body">
      <!-- 左侧：搜索 + 分组管理 -->
      <aside class="mgmt-sidebar">
        <div class="card" style="padding:16px;margin-bottom:16px">
          <form th:action="@{/friends}" method="get">
            <div style="display:flex;gap:8px">
              <input type="text" name="keyword" th:value="${keyword}" class="input" placeholder="搜索用户...">
              <button type="submit" class="btn btn-primary btn-sm">搜索</button>
            </div>
          </form>
        </div>

        <div class="card" style="padding:16px;margin-bottom:16px">
          <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text-secondary)">新建分组</div>
          <form th:action="@{/friends/group/create}" method="post">
            <div style="display:flex;gap:8px">
              <input type="text" name="name" class="input" placeholder="分组名称" required>
              <button type="submit" class="btn btn-ghost btn-sm">创建</button>
            </div>
          </form>
        </div>

        <a th:href="@{/friends/requests}" class="btn btn-ghost btn-block" style="justify-content:flex-start">
          📬 好友申请
        </a>
      </aside>

      <!-- 右侧：内容区 -->
      <div class="mgmt-content">
        <!-- 搜索结果 -->
        <div th:if="${searchResults}" class="card" style="padding:20px;margin-bottom:20px">
          <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">搜索结果</h3>
          <div th:if="${#lists.isEmpty(searchResults)}" style="color:var(--text-tertiary);font-size:13px">未找到用户</div>
          <div th:each="u : ${searchResults}" class="friend-item">
            <div class="avatar avatar-placeholder" th:text="${#strings.substring(u.nickname ?: u.username, 0, 1)}"></div>
            <div class="friend-info">
              <div class="friend-name" th:text="${u.nickname ?: u.username}"></div>
              <div class="friend-remark" th:text="'@' + ${u.username}"></div>
            </div>
            <form th:action="@{/friends/request/send}" method="post" style="display:flex;gap:6px;align-items:center">
              <input type="hidden" name="toUserId" th:value="${u.id}">
              <input type="text" name="message" class="input" placeholder="验证消息" style="width:140px;padding:6px 10px;font-size:12px">
              <button type="submit" class="btn btn-primary btn-sm">加好友</button>
            </form>
          </div>
        </div>

        <!-- 好友列表（按分组显示） -->
        <div class="card" style="padding:20px">
          <h3 style="font-size:15px;font-weight:600;margin-bottom:16px">我的好友</h3>
          <div th:if="${#lists.isEmpty(friends)}" style="color:var(--text-tertiary);font-size:13px;padding:20px 0;text-align:center">
            还没有好友，搜索用户名添加吧
          </div>
          <div class="friend-list">
            <th:block th:each="g : ${groups}">
              <div style="font-size:12px;font-weight:600;color:var(--text-tertiary);padding:10px 0 6px;text-transform:uppercase;letter-spacing:0.5px"
                   th:text="${g.name} + ' (' + ${#lists.size(friends.?[groupId == g.id])} + ')'"></div>
              <div th:each="f : ${friends.?[groupId == g.id]}" class="friend-item">
                <div class="avatar avatar-placeholder" th:text="${#strings.substring(f.remark ?: f.friendName ?: 'U', 0, 1)}"></div>
                <div class="friend-info">
                  <div class="friend-name" th:text="${f.remark ?: f.friendName ?: '好友 #' + f.friendId}"></div>
                  <div class="friend-remark" th:text="${g.name}"></div>
                </div>
                <div class="friend-actions">
                  <a th:href="@{/chat}" class="btn btn-sm btn-primary">聊天</a>
                  <form th:action="@{/friends/delete/{id}(id=${f.friendId})}" method="post" style="display:inline"
                        onsubmit="return confirm('确定删除该好友？')">
                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                  </form>
                </div>
              </div>
            </th:block>
            <!-- 未分组好友 -->
            <th:block th:if="${not #lists.isEmpty(friends.?[groupId == null])}">
              <div style="font-size:12px;font-weight:600;color:var(--text-tertiary);padding:10px 0 6px;text-transform:uppercase;letter-spacing:0.5px"
                   th:text="'未分组 (' + ${#lists.size(friends.?[groupId == null])} + ')'"></div>
              <div th:each="f : ${friends.?[groupId == null]}" class="friend-item">
                <div class="avatar avatar-placeholder" th:text="${#strings.substring(f.remark ?: f.friendName ?: 'U', 0, 1)}"></div>
                <div class="friend-info">
                  <div class="friend-name" th:text="${f.remark ?: f.friendName ?: '好友 #' + f.friendId}"></div>
                  <div class="friend-remark" style="color:var(--text-tertiary);font-size:12px">未分组</div>
                </div>
                <div class="friend-actions">
                  <a th:href="@{/chat}" class="btn btn-sm btn-primary">聊天</a>
                  <form th:action="@{/friends/delete/{id}(id=${f.friendId})}" method="post" style="display:inline"
                        onsubmit="return confirm('确定删除该好友？')">
                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                  </form>
                </div>
              </div>
            </th:block>
          </div>
        </div>

        <div class="error-msg" th:if="${error}" th:text="${error}" style="margin-top:12px"></div>
        <div th:if="${msg}" style="color:var(--accent);padding:12px 0;font-size:13px" th:text="${msg}"></div>
      </div>
    </div>
  </div>
</div>
