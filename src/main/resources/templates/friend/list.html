<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: html(title='好友管理', content=~{::main})}">
<main>
    <h2>好友管理</h2>
    <div class="toolbar">
        <form th:action="@{/friends}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="搜索用户...">
            <button type="submit" class="btn">搜索</button>
        </form>
        <a th:href="@{/friends/requests}" class="btn btn-primary">好友申请</a>
    </div>
    <div th:if="${searchResults}" class="section">
        <h3>搜索结果</h3>
        <table class="table">
            <thead><tr><th>用户名</th><th>昵称</th><th>操作</th></tr></thead>
            <tbody>
                <tr th:each="u : ${searchResults}">
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.nickname}"></td>
                    <td>
                        <form th:action="@{/friends/request/send}" method="post" style="display:inline">
                            <input type="hidden" name="toUserId" th:value="${u.id}">
                            <input type="text" name="message" placeholder="验证消息" style="width:120px">
                            <button type="submit" class="btn btn-small btn-primary">加好友</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="section">
        <h3>我的好友</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px">
            <form th:action="@{/friends/group/create}" method="post" style="display:flex;gap:4px">
                <input type="text" name="name" placeholder="新分组名" required>
                <button type="submit" class="btn btn-small">创建分组</button>
            </form>
        </div>
        <table class="table">
            <thead><tr><th>昵称/备注</th><th>用户ID</th><th>分组ID</th><th>操作</th></tr></thead>
            <tbody>
                <tr th:each="f : ${friends}">
                    <td th:text="${f.remark ?: '未设置'}"></td>
                    <td th:text="${f.friendId}"></td>
                    <td th:text="${f.groupId}"></td>
                    <td>
                        <form th:action="@{/friends/delete/{id}(id=${f.friendId})}" method="post" style="display:inline"
                              onsubmit="return confirm('确定删除？')">
                            <button type="submit" class="btn btn-small btn-danger">删除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <div th:if="${msg}" style="color:green;padding:8px" th:text="${msg}"></div>
</main>
</html>
