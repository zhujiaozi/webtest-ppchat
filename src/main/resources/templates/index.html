<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div class="index-page">
    <header class="index-header">
        <span class="brand">PP Chat</span>
        <div class="nav-links">
            <a th:href="@{/chat}">聊天</a>
            <a th:href="@{/friends}">好友</a>
            <a th:href="@{/groups}">群聊</a>
            <a th:href="@{/profile}">个人中心</a>
            <span id="theme-area"></span>
            <a th:href="@{/logout}" style="color:var(--danger)">退出</a>
        </div>
    </header>
    <div class="index-content" style="flex-direction:column;">
        <div class="index-hero">
            <h2>欢迎回来，<span th:text="${user.nickname ?: user.username}"></span></h2>
            <p>PP 在线聊天系统 — 随时随地与好友畅聊</p>
            <div class="index-actions">
                <a th:href="@{/chat}" class="btn btn-primary btn-lg">开始聊天</a>
                <a th:href="@{/friends}" class="btn btn-ghost btn-lg">管理好友</a>
            </div>
        </div>
        <div class="index-cards">
            <a th:href="@{/chat}" class="index-card">
                <div class="icon">💬</div>
                <h3>实时聊天</h3>
                <p>与好友一对一私聊或群聊，支持文字和语音消息</p>
            </a>
            <a th:href="@{/friends}" class="index-card">
                <div class="icon">👥</div>
                <h3>好友管理</h3>
                <p>搜索添加好友，创建分组，管理好友关系</p>
            </a>
            <a th:href="@{/groups}" class="index-card">
                <div class="icon">🏠</div>
                <h3>群聊</h3>
                <p>创建群组，邀请好友加入，多人实时聊天</p>
            </a>
            <a th:href="@{/profile}" class="index-card">
                <div class="icon">⚙️</div>
                <h3>个人中心</h3>
                <p>修改头像、昵称和个人信息</p>
            </a>
        </div>
    </div>
</div>
<script>
    document.getElementById('theme-area').appendChild(ThemeManager.createSwitcher());
</script>
</body>
</html>
