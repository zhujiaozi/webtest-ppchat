<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
    <style>body { overflow: hidden; }</style>
</head>
<body>
<div class="chat-app" th:attr="data-user-id=${session.currentUser.id}, data-user-name=${session.currentUser.nickname ?: session.currentUser.username}">

    <!-- 左侧导航栏 -->
    <nav class="chat-nav">
        <div th:if="${session.currentUser.avatar}">
            <img class="nav-avatar" th:src="${session.currentUser.avatar}" alt="头像">
        </div>
        <div th:unless="${session.currentUser.avatar}" class="nav-avatar-placeholder"
             th:text="${#strings.substring(session.currentUser.nickname ?: session.currentUser.username, 0, 1)}"></div>

        <button class="active" title="聊天">💬</button>
        <a th:href="@{/friends}" style="text-decoration:none"><button title="好友">👥</button></a>
        <a th:href="@{/groups}" style="text-decoration:none"><button title="群聊">🏠</button></a>

        <div class="nav-bottom">
            <div id="theme-switcher-area"></div>
            <a th:href="@{/profile}" style="text-decoration:none"><button title="个人中心">⚙️</button></a>
            <a th:href="@{/logout}" style="text-decoration:none"><button title="退出" style="color:var(--danger)">⏻</button></a>
        </div>
    </nav>

    <!-- 中间会话列表 -->
    <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="搜索联系人...">
            </div>
        </div>
        <div class="chat-sidebar-list" id="sessionList"></div>
    </aside>

    <!-- 右侧聊天区 -->
    <main class="chat-main">
        <div class="chat-header" id="chatHeader" style="display:none">
            <span class="chat-title" id="chatTitle"></span>
            <div class="chat-actions">
                <button onclick="searchMessages()" title="搜索聊天记录">🔍</button>
                <button onclick="exportChat()" title="导出聊天记录">📥</button>
            </div>
        </div>

        <div class="chat-messages" id="messages"></div>

        <div class="chat-input-area" id="inputArea" style="display:none">
            <div class="chat-toolbar">
                <button onclick="document.getElementById('fileInput').click()" title="发送文件">📎</button>
                <button id="voiceBtn" title="按住录音">🎤</button>
                <input type="file" id="fileInput" style="display:none">
            </div>
            <div class="chat-input-row">
                <textarea id="msgInput" placeholder="输入消息... (Enter发送，Shift+Enter换行)" rows="1"></textarea>
                <button class="btn btn-primary" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <p>选择一个会话开始聊天</p>
        </div>
    </main>

    <!-- 搜索面板 -->
    <aside class="chat-search-panel hidden" id="searchPanel">
        <div class="panel-header">
            <h3>搜索聊天记录</h3>
            <button class="btn btn-sm btn-ghost" onclick="toggleSearchPanel()">✕</button>
        </div>
        <div style="padding:12px 16px">
            <input type="text" class="input" id="historySearchInput" placeholder="输入关键词搜索...">
        </div>
        <div class="panel-body" id="searchResults"></div>
    </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/chat.js}"></script>
<script>
    document.getElementById('theme-switcher-area').appendChild(ThemeManager.createSwitcher());
</script>
</body>
</html>
