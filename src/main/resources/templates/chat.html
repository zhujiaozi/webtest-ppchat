<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
    <style>
        /* QQ 桌面端核心布局 — 覆盖 style.css 中的通用样式 */
        html, body { height: 100%; overflow: hidden; margin: 0; }
        .im-app { display: flex; height: 100vh; overflow: hidden; }

        /* ===== 左侧图标栏 ===== */
        .im-sidebar {
            width: 64px; flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center;
            padding: 12px 0; background: var(--bg-nav);
            -webkit-app-region: drag; /* 模拟桌面窗口拖拽 */
        }
        .im-sidebar .im-avatar {
            width: 36px; height: 36px; border-radius: 8px;
            object-fit: cover; margin-bottom: 16px; cursor: pointer;
            border: 2px solid transparent; transition: border-color 0.2s;
        }
        .im-sidebar .im-avatar:hover { border-color: var(--accent); }
        .im-sidebar .im-avatar-ph {
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
            margin-bottom: 16px; cursor: pointer;
        }
        .im-sidebar .im-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .im-sidebar .im-nav-btn {
            width: 48px; height: 48px; border: none; background: transparent;
            border-radius: 10px; cursor: pointer; font-size: 20px;
            color: var(--text-nav); transition: all 0.15s; position: relative;
            display: flex; align-items: center; justify-content: center;
            -webkit-app-region: no-drag;
        }
        .im-sidebar .im-nav-btn:hover { background: var(--bg-nav-hover); }
        .im-sidebar .im-nav-btn.active { background: var(--bg-nav-active); color: var(--text-nav-active); }
        .im-sidebar .im-nav-btn .dot {
            position: absolute; top: 8px; right: 8px;
            width: 8px; height: 8px; background: var(--danger); border-radius: 50%;
        }
        .im-sidebar .im-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 2px; align-items: center; }
        .im-sidebar .im-bottom .im-nav-btn { width: 40px; height: 40px; font-size: 16px; }

        /* ===== 中间列表面板 ===== */
        .im-panel {
            width: 260px; flex-shrink: 0;
            display: flex; flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
        }
        .im-panel-search {
            padding: 12px; border-bottom: 1px solid var(--border-light);
        }
        .im-panel-search .search-input {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 10px; background: var(--bg-primary);
            border-radius: 6px;
        }
        .im-panel-search .search-input input {
            flex: 1; border: none; background: transparent;
            font-size: 13px; color: var(--text-primary); outline: none;
        }
        .im-panel-search .search-input input::placeholder { color: var(--text-tertiary); }
        .im-panel-search .search-input .icon { color: var(--text-tertiary); font-size: 14px; }
        .im-panel-list { flex: 1; overflow-y: auto; }
        .im-panel-section-title {
            padding: 8px 14px; font-size: 11px; font-weight: 600;
            color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* 会话项 */
        .conv-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer; transition: background 0.12s;
        }
        .conv-item:hover { background: var(--bg-hover); }
        .conv-item.active { background: var(--bg-active); }
        .conv-item .conv-avatar {
            width: 40px; height: 40px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0; background: var(--bg-tertiary);
        }
        .conv-item .conv-avatar-ph {
            width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
        }
        .conv-item .conv-body { flex: 1; min-width: 0; }
        .conv-item .conv-name {
            font-size: 13px; font-weight: 500; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .conv-item .conv-preview {
            font-size: 12px; color: var(--text-tertiary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
        }
        .conv-item .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
        .conv-item .conv-time { font-size: 11px; color: var(--text-tertiary); }
        .conv-item .conv-badge {
            min-width: 16px; height: 16px; padding: 0 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; color: #fff;
            background: var(--danger); border-radius: 10px;
        }

        /* 好友项 */
        .friend-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 14px; cursor: pointer; transition: background 0.12s;
        }
        .friend-item:hover { background: var(--bg-hover); }
        .friend-item .f-avatar {
            width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; font-size: 12px;
        }
        .friend-item .f-name { font-size: 13px; color: var(--text-primary); flex: 1; }
        .friend-item .f-status { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

        /* 群项 */
        .group-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer; transition: background 0.12s;
        }
        .group-item:hover { background: var(--bg-hover); }
        .group-item .g-avatar {
            width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
            background: #4a90d9; display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 16px;
        }
        .group-item .g-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .group-item .g-notice { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

        /* ===== 右侧内容区 ===== */
        .im-content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }

        /* 聊天头部 */
        .im-chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; height: 50px; flex-shrink: 0;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border-light);
        }
        .im-chat-header .ch-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .im-chat-header .ch-actions { display: flex; gap: 4px; }
        .im-chat-header .ch-actions button {
            width: 30px; height: 30px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; font-size: 15px; color: var(--text-secondary);
        }
        .im-chat-header .ch-actions button:hover { background: var(--bg-hover); }

        /* 消息列表 */
        .im-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
        .im-msg-time { text-align: center; font-size: 11px; color: var(--text-tertiary); padding: 4px 0; }
        .im-msg-row { display: flex; gap: 8px; max-width: 65%; }
        .im-msg-row.self { margin-left: auto; flex-direction: row-reverse; }
        .im-msg-row .msg-av {
            width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: 600;
        }
        .im-msg-bubble {
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; line-height: 1.6; word-break: break-word;
        }
        .im-msg-row:not(.self) .im-msg-bubble {
            background: var(--bubble-other); color: var(--bubble-other-text);
            border-top-left-radius: 2px;
        }
        .im-msg-row.self .im-msg-bubble {
            background: var(--bubble-self); color: var(--bubble-self-text);
            border-top-right-radius: 2px;
        }
        .im-msg-sender { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }

        /* 输入区 */
        .im-input-area {
            padding: 8px 12px; background: var(--bg-secondary);
            border-top: 1px solid var(--border-light); flex-shrink: 0;
        }
        .im-input-toolbar { display: flex; gap: 2px; margin-bottom: 6px; }
        .im-input-toolbar button {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 4px; cursor: pointer; font-size: 15px; color: var(--text-secondary);
        }
        .im-input-toolbar button:hover { background: var(--bg-hover); }
        .im-input-toolbar button.recording { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
        .im-input-row { display: flex; gap: 8px; align-items: flex-end; }
        .im-input-row textarea {
            flex: 1; padding: 8px 10px; font-size: 13px;
            color: var(--text-primary); background: var(--bg-primary);
            border: 1px solid var(--border-color); border-radius: 6px;
            outline: none; resize: none; min-height: 36px; max-height: 100px;
            font-family: inherit; line-height: 1.5;
        }
        .im-input-row textarea:focus { border-color: var(--accent); }
        .im-input-row textarea::placeholder { color: var(--text-tertiary); }
        .im-input-row .send-btn {
            padding: 8px 16px; border: none; border-radius: 6px;
            background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
        }
        .im-input-row .send-btn:hover { background: var(--accent-hover); }

        /* 空状态 */
        .im-empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--text-tertiary);
        }
        .im-empty .im-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
        .im-empty p { font-size: 13px; }

        /* 搜索面板 */
        .im-search-panel {
            width: 280px; flex-shrink: 0; background: var(--bg-secondary);
            border-left: 1px solid var(--border-light);
            display: flex; flex-direction: column;
        }
        .im-search-panel.hidden { display: none; }
        .im-search-panel .sp-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid var(--border-light);
        }
        .im-search-panel .sp-header h3 { font-size: 14px; font-weight: 600; }
        .im-search-panel .sp-body { flex: 1; overflow-y: auto; padding: 12px; }
        .sp-result {
            padding: 8px; border-radius: 6px; margin-bottom: 6px; cursor: pointer;
        }
        .sp-result:hover { background: var(--bg-hover); }
        .sp-result .sp-time { font-size: 11px; color: var(--text-tertiary); }
        .sp-result .sp-text { font-size: 12px; margin-top: 2px; }
        .sp-result .sp-text mark { background: var(--warning); border-radius: 2px; padding: 0 2px; }

        /* 好友详情 / 群详情 / 个人中心 — 右侧内容 */
        .im-detail { flex: 1; overflow-y: auto; padding: 24px; }
        .im-detail-card {
            max-width: 480px; padding: 24px;
            background: var(--bg-card); border-radius: 10px;
            box-shadow: var(--shadow-sm);
        }
        .im-detail-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .im-detail .profile-avatar-area {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
        }
        .im-detail .profile-avatar-area .av {
            width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            background: var(--accent); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 8px;
        }
        .im-detail .profile-stats {
            display: flex; gap: 24px; justify-content: center;
            padding: 12px 0; margin-bottom: 16px;
            border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
        }
        .im-detail .profile-stat { text-align: center; }
        .im-detail .profile-stat .sv { font-size: 18px; font-weight: 700; color: var(--accent); }
        .im-detail .profile-stat .sl { font-size: 11px; color: var(--text-tertiary); }

        /* 成员网格 */
        .member-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
        }
        .member-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; background: var(--bg-primary); border-radius: 6px;
        }
        .member-chip .mc-av {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 10px; font-weight: 600;
        }
        .member-chip .mc-name { font-size: 12px; flex: 1; }
        .member-chip .mc-role {
            font-size: 10px; padding: 1px 6px;
            background: var(--accent-light); color: var(--accent); border-radius: 10px;
        }

        /* 面板内按钮 */
        .im-panel .panel-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; font-size: 13px; color: var(--text-secondary);
            cursor: pointer; transition: background 0.12s; border: none; background: none; width: 100%;
            text-align: left;
        }
        .im-panel .panel-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* 搜索结果面板中的用户 */
        .search-user-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-bottom: 1px solid var(--border-light);
        }
        .search-user-item .su-av {
            width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
            background: var(--accent); display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; font-size: 13px;
        }
        .search-user-item .su-info { flex: 1; }
        .search-user-item .su-name { font-size: 13px; font-weight: 500; }
        .search-user-item .su-username { font-size: 11px; color: var(--text-tertiary); }
    </style>
</head>
<body>
<div class="im-app" th:attr="data-user-id=${session.currentUser.id}, data-user-name=${session.currentUser.nickname ?: session.currentUser.username}">

    <!-- ===== 左侧图标栏 ===== -->
    <nav class="im-sidebar">
        <div th:if="${session.currentUser.avatar}">
            <img class="im-avatar" th:src="${session.currentUser.avatar}" alt="">
        </div>
        <div th:unless="${session.currentUser.avatar}" class="im-avatar-ph"
             th:text="${#strings.substring(session.currentUser.nickname ?: session.currentUser.username, 0, 1)}"></div>

        <div class="im-nav">
            <button class="im-nav-btn active" data-view="chat" title="聊天" onclick="switchView('chat')">💬</button>
            <button class="im-nav-btn" data-view="friends" title="好友" onclick="switchView('friends')">👥</button>
            <button class="im-nav-btn" data-view="groups" title="群聊" onclick="switchView('groups')">🏠</button>
        </div>

        <div class="im-bottom">
            <div id="theme-area"></div>
            <button class="im-nav-btn" data-view="profile" title="个人中心" onclick="switchView('profile')">⚙️</button>
            <a th:href="@{/logout}" style="text-decoration:none">
                <button class="im-nav-btn" title="退出" style="color:var(--danger)">⏻</button>
            </a>
        </div>
    </nav>

    <!-- ===== 中间列表面板 ===== -->
    <aside class="im-panel">
        <!-- 搜索栏 -->
        <div class="im-panel-search">
            <div class="search-input">
                <span class="icon">🔍</span>
                <input type="text" id="panelSearchInput" placeholder="搜索...">
            </div>
        </div>
        <!-- 列表区 — JS 动态渲染 -->
        <div class="im-panel-list" id="panelList"></div>
    </aside>

    <!-- ===== 右侧内容区 ===== -->
    <main class="im-content" id="contentArea">
        <!-- 默认空状态 -->
        <div class="im-empty" id="emptyState">
            <div class="im-empty-icon">💬</div>
            <p>选择一个会话开始聊天</p>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/chat.js}"></script>
<script>
    document.getElementById('theme-area').appendChild(ThemeManager.createSwitcher());
</script>
</body>
</html>
