<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/icons.js}"></script>
    <style>
        /* QQ 桌面端核心布局 — 覆盖 style.css 中的通用样式 */
        html, body { height: 100%; overflow: hidden; margin: 0; }
        .im-app { display: flex; height: 100vh; overflow: hidden; background:
            radial-gradient(circle at top left, rgba(91,141,239,.18), transparent 28%),
            radial-gradient(circle at bottom right, rgba(65,211,189,.10), transparent 24%),
            var(--bg-primary);
            position: relative;
        }

        /* 粒子效果容器 */
        .particles-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute; border-radius: 50%; opacity: 0.15;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* ===== 左侧图标栏 ===== */
        .im-sidebar {
            width: 72px; flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 0 12px; background: linear-gradient(180deg, rgba(24,34,56,.92), rgba(19,26,42,.96));
            border-right: 1px solid rgba(255,255,255,.06);
            box-shadow: inset -1px 0 0 rgba(255,255,255,.03);
            backdrop-filter: blur(18px);
            -webkit-app-region: drag;
        }
        .im-sidebar .im-avatar {
            width: 40px; height: 40px; border-radius: 12px;
            object-fit: cover; display:block;
            border: 2px solid rgba(255,255,255,.12); transition: all .22s ease;
        }
        .im-sidebar .im-avatar:hover { border-color: rgba(255,255,255,.28); transform: translateY(-1px); }
        .im-sidebar .im-avatar-ph {
            width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #5b8def, #41d3bd); color: #fff; font-weight: 700; font-size: 14px;
        }
        .im-user-entry {
            width: 52px; height: 52px; border:none; background: transparent; cursor:pointer;
            border-radius: 16px; display:flex; align-items:center; justify-content:center;
            transition: all .22s ease; -webkit-app-region: no-drag;
        }
        .im-user-entry:hover { background: rgba(255,255,255,.08); transform: translateY(-1px); }
        .im-sidebar .im-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; margin-top: 10px; }
        .im-sidebar .im-nav-btn {
            width: 52px; height: 52px; border: none; background: transparent;
            border-radius: 16px; cursor: pointer;
            color: rgba(232,238,255,.72); transition: all 0.22s ease; position: relative;
            display: flex; align-items: center; justify-content: center;
            -webkit-app-region: no-drag;
        }
        .im-sidebar .im-nav-btn:hover { background: rgba(255,255,255,.08); color:#fff; transform: translateY(-1px) scale(1.02); }
        .im-sidebar .im-nav-btn.active {
            background: linear-gradient(135deg, rgba(91,141,239,.92), rgba(108,167,255,.82));
            color: #fff; box-shadow: 0 10px 24px rgba(91,141,239,.32);
        }
        .im-sidebar .im-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; align-items: center; }
        .im-sidebar .im-bottom .im-nav-btn { width: 44px; height: 44px; border-radius: 14px; }
        .im-sidebar .im-bottom .im-nav-btn.danger { color: #ff8e92; }
        .im-sidebar .im-bottom .im-nav-btn.danger:hover { background: rgba(255,95,95,.12); color:#ffd5d7; }

        /* WebSocket 连接状态指示器 */
        .ws-status-indicator {
            width: 8px; height: 8px; border-radius: 50%;
            background: #fa5151; transition: all 0.3s;
        }
        .ws-status-indicator.connected { background: #07c160; box-shadow: 0 0 6px rgba(7,193,96,.5); }
        .ws-status-indicator.connecting { background: #ffc300; animation: pulse 1.5s infinite; }

        /* ===== 中间列表面板 ===== */
        .im-panel {
            min-width: 200px; max-width: 400px;
            display: flex; flex-direction: column;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
        }
        .im-resizer {
            width: 4px; cursor: col-resize; background: transparent;
            transition: background 0.2s; flex-shrink: 0;
        }
        .im-resizer:hover, .im-resizer.active { background: var(--accent); opacity: 0.5; }
        .im-panel-search {
            padding: 12px; border-bottom: 1px solid var(--border-light);
        }
        .im-panel-search .search-input {
            display: flex; align-items: center; gap: 6px;
            padding: 7px 10px; background: var(--bg-primary);
            border-radius: 6px;
        }
        .im-panel-search .search-input input {
            flex: 1; border: none; background: transparent;
            font-size: 13px; color: var(--text-primary); outline: none;
        }
        .im-panel-search .search-input input::placeholder { color: var(--text-tertiary); }
        .im-panel-search .search-input .icon { color: var(--text-tertiary); font-size: 14px; }
        .im-panel-list { flex: 1; overflow-y: auto; }
        .im-panel-section-title {
            padding: 8px 14px; font-size: 11px; font-weight: 600;
            color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* 会话项 */
        .conv-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer; transition: background 0.12s;
        }
        .conv-item:hover { background: var(--bg-hover); }
        .conv-item.active { background: var(--bg-active); }
        .conv-item .conv-avatar {
            width: 40px; height: 40px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0; background: var(--bg-tertiary);
        }
        .conv-item .conv-avatar-ph {
            width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
        }
        .conv-item .conv-body { flex: 1; min-width: 0; }
        .conv-item .conv-name {
            font-size: 13px; font-weight: 500; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .conv-item .conv-preview {
            font-size: 12px; color: var(--text-tertiary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
        }
        .conv-item .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
        .conv-item .conv-time { font-size: 11px; color: var(--text-tertiary); }
        .conv-item .conv-badge {
            min-width: 16px; height: 16px; padding: 0 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 600; color: #fff;
            background: var(--danger); border-radius: 10px;
        }

        /* 好友项 */
        .friend-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 14px; cursor: pointer; transition: background 0.12s;
        }
        .friend-item:hover { background: var(--bg-hover); }
        .friend-item .f-avatar {
            width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; font-size: 12px;
        }
        .friend-item .f-name { font-size: 13px; color: var(--text-primary); flex: 1; }
        .friend-item .f-status { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

        /* 群项 */
        .group-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer; transition: background 0.12s;
        }
        .group-item:hover { background: var(--bg-hover); }
        .group-item .g-avatar {
            width: 40px; height: 40px; border-radius: 6px; flex-shrink: 0;
            background: #4a90d9; display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 16px;
        }
        .group-item .g-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
        .group-item .g-notice { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

        /* ===== 右侧内容区 ===== */
        .im-content { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-primary); }

        /* 聊天头部 */
        .im-chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; height: 50px; flex-shrink: 0;
            background: var(--bg-secondary); border-bottom: 1px solid var(--border-light);
        }
        .im-chat-header .ch-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .im-chat-header .ch-actions { display: flex; gap: 4px; }
        .im-chat-header .ch-actions button {
            width: 30px; height: 30px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; font-size: 15px; color: var(--text-secondary);
        }
        .im-chat-header .ch-actions button:hover { background: var(--bg-hover); }

        /* 消息列表 */
        .im-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
        .im-msg-time { text-align: center; font-size: 11px; color: var(--text-tertiary); padding: 4px 0; }
        .im-msg-row { display: flex; gap: 8px; max-width: 65%; }
        .im-msg-row.self { margin-left: auto; flex-direction: row-reverse; }
        .im-msg-row .msg-av {
            width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: 600;
        }
        .im-msg-bubble {
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; line-height: 1.6; word-break: break-word;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .im-msg-bubble:hover {
            transform: scale(1.01);
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        .im-msg-row:not(.self) .im-msg-bubble {
            background: var(--bubble-other); color: var(--bubble-other-text);
            border-top-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,.06);
        }
        .im-msg-row.self .im-msg-bubble {
            background: var(--bubble-self); color: var(--bubble-self-text);
            border-top-right-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,.06);
        }
        .im-msg-sender { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }

        /* 输入区 */
        .im-input-area {
            padding: 8px 12px; background: var(--bg-secondary);
            border-top: 1px solid var(--border-light); flex-shrink: 0;
        }
        .im-input-toolbar { display: flex; gap: 2px; margin-bottom: 6px; }
        .im-input-toolbar button {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 4px; cursor: pointer; font-size: 15px; color: var(--text-secondary);
        }
        .im-input-toolbar button:hover { background: var(--bg-hover); }
        .im-input-toolbar button.recording { color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
        .im-input-row { display: flex; gap: 8px; align-items: flex-end; }
        .im-input-row textarea {
            flex: 1; padding: 10px 12px; font-size: 14px;
            color: var(--text-primary); background: var(--bg-primary);
            border: 1px solid var(--border-color); border-radius: 8px;
            outline: none; resize: none; min-height: 44px; max-height: 120px;
            font-family: inherit; line-height: 1.6;
        }
        .im-input-row textarea:focus { border-color: var(--accent); }
        .im-input-row textarea::placeholder { color: var(--text-tertiary); }
        .im-input-row .send-btn {
            padding: 8px 16px; border: none; border-radius: 6px;
            background: var(--accent); color: #fff; font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
        }
        .im-input-row .send-btn:hover { background: var(--accent-hover); }
        .im-input-row .voice-btn {
            width: 36px; height: 36px; border: none; border-radius: 6px;
            background: var(--bg-primary); color: var(--text-secondary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: all 0.15s;
            border: 1px solid var(--border-color);
        }
        .im-input-row .voice-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .im-input-row .voice-btn.recording {
            background: rgba(250,81,81,.1); color: var(--danger);
            border-color: var(--danger); animation: pulse 1s infinite;
        }

        /* 空状态 */
        .im-empty {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--text-tertiary);
        }
        .im-empty .im-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
        .im-empty p { font-size: 13px; }

        /* 搜索面板 */
        .im-search-panel {
            width: 280px; flex-shrink: 0; background: var(--bg-secondary);
            border-left: 1px solid var(--border-light);
            display: flex; flex-direction: column;
        }
        .im-search-panel.hidden { display: none; }
        .im-search-panel .sp-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid var(--border-light);
        }
        .im-search-panel .sp-header h3 { font-size: 14px; font-weight: 600; }
        .im-search-panel .sp-body { flex: 1; overflow-y: auto; padding: 12px; }
        .sp-result {
            padding: 8px; border-radius: 6px; margin-bottom: 6px; cursor: pointer;
        }
        .sp-result:hover { background: var(--bg-hover); }
        .sp-result .sp-time { font-size: 11px; color: var(--text-tertiary); }
        .sp-result .sp-text { font-size: 12px; margin-top: 2px; }
        .sp-result .sp-text mark { background: var(--warning); border-radius: 2px; padding: 0 2px; }

        /* 好友详情 / 群详情 / 个人中心 — 右侧内容 */
        .im-detail { flex: 1; overflow-y: auto; padding: 0; display: flex; }
        .im-detail-card {
            width: 100%; min-height: 100%; padding: 24px;
            background: var(--bg-card);
            box-sizing: border-box;
        }
        .im-detail-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .im-detail .profile-avatar-area {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
        }
        .im-detail .profile-avatar-area .av {
            width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            background: var(--accent); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 24px; font-weight: 700; margin-bottom: 8px;
        }
        .im-detail .profile-stats {
            display: flex; gap: 24px; justify-content: center;
            padding: 12px 0; margin-bottom: 16px;
            border-top: 1px solid var(--border-light); border-bottom: 1px solid var(--border-light);
        }
        .im-detail .profile-stat { text-align: center; }
        .im-detail .profile-stat .sv { font-size: 18px; font-weight: 700; color: var(--accent); }
        .im-detail .profile-stat .sl { font-size: 11px; color: var(--text-tertiary); }

        /* 成员网格 */
        .member-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
        }
        .member-chip {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; background: var(--bg-primary); border-radius: 6px;
        }
        .member-chip .mc-av {
            width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
            background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 10px; font-weight: 600;
        }
        .member-chip .mc-name { font-size: 12px; flex: 1; }
        .member-chip .mc-role {
            font-size: 10px; padding: 1px 6px;
            background: var(--accent-light); color: var(--accent); border-radius: 10px;
        }

        /* 面板内按钮 */
        .im-panel .panel-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 14px; font-size: 13px; color: var(--text-secondary);
            cursor: pointer; transition: background 0.12s; border: none; background: none; width: 100%;
            text-align: left;
        }
        .im-panel .panel-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* 搜索结果面板中的用户 */
        .search-user-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-bottom: 1px solid var(--border-light);
        }
        .search-user-item .su-av {
            width: 36px; height: 36px; border-radius: 6px; flex-shrink: 0;
            background: var(--accent); display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; font-size: 13px;
        }
        .search-user-item .su-info { flex: 1; }
        .search-user-item .su-name { font-size: 13px; font-weight: 500; }
        .search-user-item .su-username { font-size: 11px; color: var(--text-tertiary); }

        /* ===== 右侧信息抽屉 ===== */
        .im-drawer {
            width: 300px; flex-shrink: 0;
            display: flex; flex-direction: column;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-light);
            transition: width 0.25s ease, opacity 0.2s ease;
            overflow: hidden;
        }
        .im-drawer.hidden { width: 0; opacity: 0; border: none; }
        .im-drawer-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; flex-shrink: 0;
            border-bottom: 1px solid var(--border-light);
        }
        .im-drawer-header span { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .drawer-close {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
        }
        .drawer-close:hover { background: var(--bg-hover); }
        .im-drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
        .drawer-section { margin-bottom: 20px; }
        .drawer-section-title {
            font-size: 11px; font-weight: 600; color: var(--text-tertiary);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
        }
        .drawer-user-info { text-align: center; padding: 16px 0; }
        .drawer-user-info .du-avatar {
            width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent); color: #fff; font-size: 22px; font-weight: 700;
        }
        .drawer-user-info .du-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .drawer-user-info .du-id { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
        .drawer-actions { display: flex; flex-direction: column; gap: 4px; }
        .drawer-action-btn {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border: none; background: transparent;
            border-radius: 8px; cursor: pointer; font-size: 13px;
            color: var(--text-secondary); transition: all 0.15s; width: 100%; text-align: left;
        }
        .drawer-action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .drawer-action-btn.danger { color: var(--danger); }
        .drawer-action-btn.danger:hover { background: rgba(250,81,81,.08); }
        .drawer-member-list { display: flex; flex-direction: column; gap: 6px; }
        .drawer-member {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            border-radius: 8px; transition: background 0.12s;
        }
        .drawer-member:hover { background: var(--bg-hover); }
        .drawer-member .dm-av {
            width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-tertiary); color: #fff; font-size: 12px; font-weight: 600;
        }
        .drawer-member .dm-name { font-size: 13px; flex: 1; color: var(--text-primary); }
        .drawer-member .dm-role {
            font-size: 10px; padding: 2px 8px;
            background: var(--accent-light); color: var(--accent); border-radius: 10px;
        }

        /* ===== 自定义模态框 ===== */
        .im-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .im-modal.hidden { display: none; }
        .im-modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        .im-modal-content {
            position: relative; background: var(--bg-card); border-radius: 12px;
            min-width: 320px; max-width: 480px; width: 90%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            animation: modalSlideIn 0.2s ease;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .im-modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--border-light);
        }
        .im-modal-header span { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .modal-close {
            width: 28px; height: 28px; border: none; background: transparent;
            border-radius: 6px; cursor: pointer; color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: var(--bg-hover); }
        .im-modal-body { padding: 20px; }
        .im-modal-footer {
            display: flex; gap: 8px; justify-content: flex-end;
            padding: 12px 20px; border-top: 1px solid var(--border-light);
        }
    </style>
</head>
<body>
<div class="im-app" th:attr="data-user-id=${session.currentUser.id}, data-user-name=${session.currentUser.nickname ?: session.currentUser.username}">
    <div class="particles-container" id="particlesContainer"></div>

    <nav class="im-sidebar">
        <div class="im-nav">
            <button class="im-nav-btn active" data-view="chat" title="聊天列表" onclick="switchView('chat')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="im-nav-btn" data-view="friends" title="好友列表" onclick="switchView('friends')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
            <button class="im-nav-btn" data-view="groups" title="群聊列表" onclick="switchView('groups')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </button>
            <button class="im-nav-btn" data-view="friendRequests" title="好友申请" onclick="switchView('friendRequests')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </button>
        </div>

        <div class="im-bottom">
            <div id="theme-area"></div>
            <button class="im-user-entry" title="个人资料与设置" onclick="switchView('profile')">
                <div th:if="${session.currentUser.avatar}">
                    <img class="im-avatar" th:src="${session.currentUser.avatar}" alt="">
                </div>
                <div th:unless="${session.currentUser.avatar}" class="im-avatar-ph"
                     th:text="${#strings.substring(session.currentUser.nickname ?: session.currentUser.username, 0, 1)}"></div>
            </button>
            <div id="ws-status" class="ws-status-indicator" title="WebSocket 连接状态"></div>
        </div>
    </nav>

    <aside class="im-panel" id="imPanel">
        <div class="im-panel-search">
            <div class="search-input">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex-shrink:0;color:var(--text-tertiary)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="panelSearchInput" placeholder="搜索...">
            </div>
        </div>
        <div class="im-panel-list" id="panelList"></div>
    </aside>

    <div class="im-resizer" id="imResizer"></div>

    <main class="im-content" id="contentArea">
        <div class="im-empty" id="emptyState">
            <svg viewBox="0 0 120 120" width="100" height="100" style="opacity:0.35;margin-bottom:16px">
                <defs><linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5b8def"/><stop offset="100%" style="stop-color:#41d3bd"/></linearGradient></defs>
                <rect x="15" y="25" width="90" height="65" rx="12" fill="url(#emptyGrad)" opacity="0.15"/>
                <path d="M30 45h60M30 58h40M30 71h50" stroke="url(#emptyGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
                <circle cx="85" cy="75" r="18" fill="url(#emptyGrad)" opacity="0.2"/>
                <path d="M78 75l5 5 9-9" stroke="url(#emptyGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
            </svg>
            <p style="font-size:14px;font-weight:500">选择一个会话开始聊天</p>
            <p style="font-size:12px;margin-top:4px;opacity:0.6">在左侧列表中选择好友或群聊</p>
        </div>
    </main>

    <aside class="im-drawer hidden" id="infoDrawer">
        <div class="im-drawer-header">
            <span id="drawerTitle">更多信息</span>
            <button class="drawer-close" onclick="toggleInfoDrawer(false)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="im-drawer-body" id="drawerBody"></div>
    </aside>

    <!-- 自定义模态框 -->
    <div class="im-modal hidden" id="imModal">
        <div class="im-modal-overlay" onclick="closeModal()"></div>
        <div class="im-modal-content">
            <div class="im-modal-header">
                <span id="modalTitle">提示</span>
                <button class="modal-close" onclick="closeModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="im-modal-body" id="modalBody"></div>
            <div class="im-modal-footer" id="modalFooter"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:src="@{/js/chat-core.js}"></script>
<script th:src="@{/js/chat-ui.js}"></script>
<script th:src="@{/js/chat-view.js}"></script>
<script th:src="@{/js/chat-friends.js}"></script>
<script th:src="@{/js/chat-groups.js}"></script>
<script th:src="@{/js/chat-profile.js}"></script>
<script>
    document.getElementById('theme-area').appendChild(ThemeManager.createSwitcher());
</script>
</body>
</html>
