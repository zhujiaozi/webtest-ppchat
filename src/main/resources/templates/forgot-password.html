<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 — PP Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <h1>PP</h1>
            <p>找回密码</p>
        </div>
        <div class="error-msg" th:if="${error}" th:text="${error}"></div>
        <div th:if="${success}" class="success-msg" th:text="${success}"></div>
        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" class="input" required placeholder="请输入用户名" th:value="${username}">
            </div>
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" name="newPassword" class="input" required placeholder="请输入新密码">
            </div>
            <button type="submit" class="btn btn-primary btn-block">重置密码</button>
        </form>
        <p class="form-footer"><a th:href="@{/login}">返回登录</a></p>
    </div>
</div>
</body>
</html>
